[project]
name = "matplotlib-gui-dev"
version = "0.0.0"
description = "開発用の依存のみ（実行時には使わない）"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: ブラウザ(Playwright)を使うE2Eテスト",
    "unit: 単体テスト",
    "slow: 時間のかかるテスト",
]

[dependency-groups]
dev = [
    # ブラウザ(Pyodide 314.0.3)と同じバージョンに固定する
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "numpy==2.4.3",
    "openpyxl==3.1.5",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]
