# PyScript 2026.7.3 (Pyodide 314.0.3 / Python 3.14)。
# passthrough: packages を micropip を介さず直接 loadPyodide に渡す（Pyodide 同梱パッケージだけなので PyPI 解決が不要）。
# openpyxl / et_xmlfile は Pyodide 同梱ではないため、.xlsx を初めて読み込むときに py/main.py が遅延導入する。
packages = ["pandas", "matplotlib"]
packages_cache = "passthrough"

# py/mplgui/*.py を Pyodide の仮想FS（カレントディレクトリ直下）に配置し、`import mplgui` できるようにする。
# キーは取得元（ページからの相対パス）、値は配置先。
[files]
"./py/mplgui/__init__.py" = "./mplgui/__init__.py"
"./py/mplgui/api.py" = "./mplgui/api.py"
"./py/mplgui/errors.py" = "./mplgui/errors.py"
"./py/mplgui/settings.py" = "./mplgui/settings.py"
"./py/mplgui/loader.py" = "./mplgui/loader.py"
"./py/mplgui/plotting.py" = "./mplgui/plotting.py"
"./py/mplgui/runner.py" = "./mplgui/runner.py"
"./py/mplgui/fonts.py" = "./mplgui/fonts.py"
"./py/mplgui/runtime.py" = "./mplgui/runtime.py"
